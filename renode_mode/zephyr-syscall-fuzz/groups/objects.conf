# Group "objects": dynamic kernel objects, permissions, thread stacks,
# events and condition variables
CONFIG_SYSCALL_FUZZ_GROUP_OBJECTS=y
CONFIG_DYNAMIC_OBJECTS=y
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_DYNAMIC_THREAD_POOL_SIZE=2
# The pool is the default, but pool stacks are never granted to the user
# thread that allocated them, so k_thread_create() rejects them (-EPERM).
# Allocate from the heap first and fall back to the pool.
CONFIG_DYNAMIC_THREAD_PREFER_ALLOC=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_EVENTS=y
CONFIG_POLL=y
