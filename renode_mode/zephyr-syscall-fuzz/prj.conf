CONFIG_USERSPACE=y
CONFIG_ASSERT=y
CONFIG_BOOT_BANNER=n
CONFIG_LOG=n

# Fuzzing speed: console output (fault dumps on every user oops) and the
# size-optimized libc dominate run time. Crashes are described by the
# afl_crash record instead; see replay.sh.
CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_PRINTK=n
CONFIG_EXCEPTION_DEBUG=n
